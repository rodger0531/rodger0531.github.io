<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>RoloPolo Home Lab</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0d1117;
        color: #e6edf3;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        max-width: 700px;
        padding: 48px;
        text-align: center;
      }

      h1 {
        font-size: clamp(2.5rem, 8vw, 5rem);
        margin: 0 0 16px;
      }

      p {
        color: #8b949e;
        font-size: 1.25rem;
        line-height: 1.6;
      }

      .status {
        display: inline-block;
        margin-top: 24px;
        padding: 10px 18px;
        border: 1px solid #30363d;
        border-radius: 999px;
        color: #3fb950;
      }
    </style>
  </head>

  <body>
    <main>
      <h1>RoloPolo 🐳</h1>

      <p>This page is fo sho.</p>

      <div class="status">● Home lab is online</div>
    </main>
  </body>
</html>
